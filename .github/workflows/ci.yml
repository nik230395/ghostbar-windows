name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests (backends, parsers, error messages)
        run: dotnet test tests/Ghostbar.Tests --configuration Release

      - name: Build
        run: ./build.ps1

      - name: Smoke test on Windows (start, hotkey, window flags, WebView2)
        run: ./scripts/smoke-test.ps1

      - name: Package
        if: always()
        shell: pwsh
        run: |
          if (Test-Path publish) {
            Compress-Archive -Path publish/* -DestinationPath Ghostbar-win-x64.zip -Force
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghostbar-ci
          path: |
            Ghostbar-win-x64.zip
            smoke-output/
